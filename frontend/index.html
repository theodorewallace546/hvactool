<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>HVAC Salesman Q&A</title>
<style>
  :root{
    --bg:#f6f5f2;
    --panel:#ffffff;
    --ink:#22261f;
    --muted:#6b6f66;
    --border:#e2e0d8;
    --accent:#2d6a4f;
    --accent-ink:#ffffff;
    --bubble-user:#2d6a4f;
    --bubble-bot:#eef0ea;
    --warn-bg:#fdf3e7;
    --warn-border:#e8c99a;
    --warn-ink:#7a4a12;
    --bad-bg:#fbeaea;
    --bad-border:#e8b4b4;
    --bad-ink:#8a2e2e;
    --good-bg:#eaf4ee;
    --good-border:#b7d9c4;
    --good-ink:#1f5c3a;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;
    flex-direction:column;
  }
  header{
    padding:14px 18px 10px 18px;
    border-bottom:1px solid var(--border);
    background:var(--panel);
  }
  header h1{
    font-size:1.05rem;
    margin:0 0 2px 0;
    font-weight:700;
  }
  header p{
    margin:0;
    font-size:.78rem;
    color:var(--muted);
  }
  #status-banner{
    display:none;
    background:var(--warn-bg);
    border-bottom:1px solid var(--warn-border);
    color:var(--warn-ink);
    font-size:.78rem;
    padding:8px 18px;
    line-height:1.4;
  }
  #status-banner.show{display:block;}

  .tabs{
    display:flex;
    border-bottom:1px solid var(--border);
    background:var(--panel);
  }
  .tab-btn{
    flex:1;
    padding:11px 8px;
    border:none;
    background:none;
    font-size:.85rem;
    font-weight:600;
    color:var(--muted);
    cursor:pointer;
    border-bottom:2px solid transparent;
  }
  .tab-btn.active{
    color:var(--accent);
    border-bottom-color:var(--accent);
  }

  main{
    flex:1;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    min-height:0;
    max-width:640px;
    width:100%;
    margin:0 auto;
  }
  .view{display:none; flex:1; flex-direction:column; overflow:hidden; min-height:0;}
  .view.active{display:flex;}

  /* Chat view */
  #chat-log{
    flex:1;
    min-height:0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .msg{
    max-width:85%;
    padding:10px 13px;
    border-radius:14px;
    font-size:.92rem;
    line-height:1.45;
    white-space:pre-wrap;
  }
  .msg.user{
    align-self:flex-end;
    background:var(--bubble-user);
    color:var(--accent-ink);
    border-bottom-right-radius:4px;
  }
  .msg.bot{
    align-self:flex-start;
    background:var(--bubble-bot);
    color:var(--ink);
    border-bottom-left-radius:4px;
  }
  .msg.error{
    align-self:center;
    background:var(--warn-bg);
    border:1px solid var(--warn-border);
    color:var(--warn-ink);
  }
  .msg.searching{
    align-self:flex-start;
    color:var(--muted);
    font-style:italic;
    font-size:.85rem;
  }
  .tag{
    display:inline-block;
    font-size:.68rem;
    font-weight:700;
    letter-spacing:.03em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:4px;
  }
  #chat-input-row{
    display:flex;
    gap:8px;
    padding:12px;
    border-top:1px solid var(--border);
    background:var(--panel);
  }
  #chat-input{
    flex:1;
    border:1.5px solid var(--border);
    border-radius:22px;
    padding:11px 16px;
    font-size:.92rem;
    outline:none;
    resize:none;
    font-family:inherit;
  }
  #chat-input:focus{border-color:var(--accent);}
  #chat-send{
    border:none;
    background:var(--accent);
    color:var(--accent-ink);
    border-radius:22px;
    padding:0 18px;
    font-size:.9rem;
    font-weight:600;
    cursor:pointer;
  }
  #chat-send:disabled{opacity:.5; cursor:default;}

  /* Wizard view */
  #wizard-progress{
    padding:10px 18px 0 18px;
    font-size:.72rem;
    color:var(--muted);
    font-weight:600;
    letter-spacing:.03em;
    text-transform:uppercase;
  }
  #wizard-body{
    flex:1;
    min-height:0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:14px 18px 18px 18px;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px;
    margin-bottom:14px;
  }
  .card h2{font-size:1rem; margin:0 0 6px 0;}
  .card .sub{font-size:.82rem; color:var(--muted); margin:0 0 14px 0; line-height:1.45;}
  .field-label{
    display:block;
    font-size:.78rem;
    font-weight:600;
    color:var(--muted);
    margin-bottom:6px;
  }
  input[type="text"], input[type="number"], select, textarea{
    width:100%;
    border:1.5px solid var(--border);
    border-radius:8px;
    padding:9px 12px;
    font-size:.92rem;
    font-family:inherit;
    outline:none;
    margin-bottom:14px;
    background:#fff;
    color:var(--ink);
  }
  textarea{resize:vertical; min-height:60px;}
  input:focus, select:focus, textarea:focus{border-color:var(--accent);}

  .result-box{
    background:var(--bubble-bot);
    border-radius:10px;
    padding:12px 14px;
    font-size:.88rem;
    line-height:1.5;
    white-space:pre-wrap;
    margin-bottom:14px;
  }
  .result-box.warn{background:var(--warn-bg); border:1px solid var(--warn-border); color:var(--warn-ink);}
  .result-box.good{background:var(--good-bg); border:1px solid var(--good-border); color:var(--good-ink);}
  .result-box.bad{background:var(--bad-bg); border:1px solid var(--bad-border); color:var(--bad-ink);}

  .stat-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px;}
  .stat{
    flex:1;
    min-width:120px;
    background:var(--bubble-bot);
    border-radius:10px;
    padding:10px 12px;
  }
  .stat .num{font-size:1.25rem; font-weight:700;}
  .stat .lbl{font-size:.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:.03em;}

  .btn{
    border:none;
    border-radius:10px;
    padding:12px;
    font-size:.92rem;
    font-weight:600;
    cursor:pointer;
    width:100%;
  }
  .btn-primary{background:var(--accent); color:var(--accent-ink);}
  .btn-primary:disabled{opacity:.5; cursor:default;}
  .btn-secondary{background:var(--bubble-bot); color:var(--ink); margin-top:8px;}
  .btn-row{display:flex; gap:10px;}
  .btn-row .btn{flex:1;}

  .photo-btn{
    display:block;
    width:100%;
    text-align:center;
    border:1.5px dashed var(--border);
    border-radius:10px;
    padding:20px 12px;
    color:var(--muted);
    font-size:.85rem;
    cursor:pointer;
    background:#fafaf7;
    margin-bottom:10px;
  }
  .photo-btn:hover{border-color:var(--accent); color:var(--accent);}
  .preview-wrap img{
    max-width:100%;
    border-radius:10px;
    border:1px solid var(--border);
    display:block;
    margin-bottom:10px;
  }

  .rating-row{display:flex; gap:8px; margin-bottom:10px;}
  .rating-btn{
    flex:1;
    padding:10px 4px;
    border-radius:9px;
    border:1.5px solid var(--border);
    background:#fff;
    font-size:.8rem;
    font-weight:600;
    cursor:pointer;
    color:var(--muted);
  }
  .rating-btn.selected.good{background:var(--good-bg); border-color:var(--good-border); color:var(--good-ink);}
  .rating-btn.selected.warn{background:var(--warn-bg); border-color:var(--warn-border); color:var(--warn-ink);}
  .rating-btn.selected.bad{background:var(--bad-bg); border-color:var(--bad-border); color:var(--bad-ink);}


  .summary-item{padding:10px 0; border-bottom:1px solid var(--border);}
  .summary-item:last-child{border-bottom:none;}
  .summary-item .k{font-size:.72rem; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); font-weight:600;}
  .summary-item .v{font-size:.9rem; margin-top:2px; white-space:pre-wrap;}

  .landing{padding:18px;}
  .landing .card{text-align:center;}
  .landing .card p{color:var(--muted); font-size:.85rem; margin:0 0 14px 0;}

  /* Quote step */
  .qview-toggle{display:flex; gap:8px; margin-bottom:12px;}
  .qview-btn{flex:1; padding:8px; border-radius:8px; border:1.5px solid var(--border); background:#fff; font-size:.8rem; font-weight:600; color:var(--muted); cursor:pointer;}
  .qview-btn.active{background:var(--accent); border-color:var(--accent); color:#fff;}
  .margin-row{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .margin-row label{font-size:.82rem; font-weight:600; white-space:nowrap;}
  .margin-row input{margin-bottom:0; width:80px;}
  .qtable{width:100%; border-collapse:collapse; font-size:.82rem; margin-bottom:12px;}
  .qtable th{text-align:left; font-size:.68rem; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); padding:6px 4px; border-bottom:1.5px solid var(--border);}
  .qtable td{padding:7px 4px; border-bottom:1px solid var(--border); vertical-align:top;}
  .qtable td.r, .qtable th.r{text-align:right;}
  .qtable input[type="number"]{width:70px; margin-bottom:0; padding:5px 6px; font-size:.8rem;}
  .qtable .qname{font-weight:600;}
  .qtable .qauto{font-size:.68rem; color:var(--accent); font-weight:700; text-transform:uppercase; letter-spacing:.02em;}
  .qtable .qrm{background:none; border:none; color:var(--bad-ink); cursor:pointer; font-size:1rem; padding:2px 6px;}
  .qtotals{display:flex; gap:8px; flex-wrap:wrap; margin:12px 0;}
  .qtotals .stat{flex:1; min-width:90px;}
  .add-svc-wrap{position:relative; margin-bottom:14px;}
  .add-svc-results{border:1.5px solid var(--border); border-radius:8px; max-height:220px; overflow-y:auto; background:#fff; margin-top:-8px; margin-bottom:14px;}
  .add-svc-item{padding:9px 12px; font-size:.83rem; cursor:pointer; border-bottom:1px solid var(--border);}
  .add-svc-item:last-child{border-bottom:none;}
  .add-svc-item:hover{background:var(--bubble-bot);}
  .photo-required-note{font-size:.72rem; color:var(--bad-ink); margin:-6px 0 10px 0;}

  /* Room list / vent confirm steps */
  .room-row{display:flex; gap:8px; align-items:center; margin-bottom:8px;}
  .room-row .room-name{flex:1; margin-bottom:0;}
  .room-row .room-count{width:60px; margin-bottom:0;}
  .room-row .room-size{width:70px; margin-bottom:0;}
  .room-row .room-rm{background:none; border:none; color:var(--bad-ink); cursor:pointer; font-size:1rem; padding:2px 6px; flex:0 0 auto;}
  .room-row-label{flex:1; font-size:.9rem; font-weight:600;}
  #add-room-btn{margin-top:4px;}

  /* Sidebar (projects) */
  header{position:relative; display:flex; align-items:center; gap:12px;}
  #menu-btn{
    border:none; background:none; cursor:pointer; padding:6px;
    font-size:1.3rem; line-height:1; color:var(--ink); flex:0 0 auto;
  }
  header .header-titles{flex:1;}
  #sidebar-backdrop{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:40;
  }
  #sidebar-backdrop.open{display:block;}
  #sidebar{
    position:fixed; top:0; left:-300px; width:280px; height:100%;
    background:var(--panel); border-right:1px solid var(--border);
    z-index:41; transition:left .18s ease; display:flex; flex-direction:column;
    box-shadow:2px 0 12px rgba(0,0,0,.15);
  }
  #sidebar.open{left:0;}
  #sidebar-header{padding:16px; border-bottom:1px solid var(--border);}
  #sidebar-header h2{font-size:.85rem; margin:0 0 10px 0; text-transform:uppercase; letter-spacing:.04em; color:var(--muted);}
  #new-visit-btn{
    width:100%; border:none; background:var(--accent); color:#fff;
    border-radius:9px; padding:10px; font-size:.85rem; font-weight:600; cursor:pointer;
  }
  #project-list{flex:1; overflow-y:auto; padding:8px;}
  .project-item{
    display:flex; align-items:center; gap:6px; padding:10px 8px; border-radius:9px;
    cursor:pointer; margin-bottom:2px;
  }
  .project-item:hover{background:var(--bubble-bot);}
  .project-item.active{background:var(--good-bg); border:1px solid var(--good-border);}
  .project-item .p-info{flex:1; min-width:0;}
  .project-item .p-name{font-size:.85rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .project-item .p-meta{font-size:.68rem; color:var(--muted);}
  .project-item .p-btn{background:none; border:none; color:var(--muted); cursor:pointer; font-size:.85rem; padding:4px;}
  .project-item .p-btn:hover{color:var(--ink);}
  .project-item .p-btn.p-del:hover{color:var(--bad-ink);}
  #project-list .empty{padding:14px 8px; font-size:.8rem; color:var(--muted);}

  /* Desktop: dock the sidebar permanently instead of hiding it behind the
     hamburger — a hidden drawer is the right call on a phone (the primary
     use case), but easy to miss on a wide screen where a persistent
     sidebar is what people expect. */
  @media (min-width: 900px){
    body{flex-direction:row; align-items:stretch;}
    #menu-btn{display:none;}
    #sidebar-backdrop{display:none !important;}
    #sidebar{
      position:static; left:0; height:auto; box-shadow:none;
      flex:0 0 280px; border-right:1px solid var(--border);
    }
    #app-content{flex:1; min-width:0; display:flex; flex-direction:column;}
  }
</style>
</head>
<body>

<div id="sidebar-backdrop"></div>
<div id="sidebar">
  <div id="sidebar-header">
    <h2>Past Jobs</h2>
    <button id="new-visit-btn">+ New Visit</button>
  </div>
  <div id="project-list"></div>
</div>

<div id="app-content">
<header>
  <button id="menu-btn" aria-label="Open visits list">&#9776;</button>
  <div class="header-titles">
    <h1>HVAC Salesman Q&amp;A</h1>
    <p>Home visit walkthrough &amp; field reference assistant</p>
  </div>
</header>

<div id="status-banner"></div>

<div class="tabs">
  <button class="tab-btn active" data-view="wizard-view">Home Visit</button>
  <button class="tab-btn" data-view="chat-view">Ask a Question</button>
</div>

<script src="pricing-catalog.js"></script>
<main>

  <!-- ============ HOME VISIT WIZARD ============ -->
  <section id="wizard-view" class="view active">
    <div id="wizard-progress"></div>
    <div id="wizard-body"></div>
  </section>

  <!-- ============ CHAT ============ -->
  <section id="chat-view" class="view">
    <div id="chat-log"></div>
    <div id="chat-input-row">
      <textarea id="chat-input" rows="1" placeholder="e.g. What size furnace for a 1,800 sqft home?"></textarea>
      <button id="chat-send">Send</button>
    </div>
  </section>

</main>
</div>

<script>
/* ============================================================
   SHARED
   ============================================================ */
const statusBanner = document.getElementById('status-banner');

fetch('/api/status').then(r => r.json()).then(d => {
  if (!d.api_key_configured) {
    statusBanner.textContent = 'No OpenAI API key configured yet — add one to backend/.env and restart the server to enable live answers.';
    statusBanner.classList.add('show');
  }
}).catch(() => {});

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.view).classList.add('active');
  });
});

function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ============================================================
   CHAT
   ============================================================ */
const chatLog = document.getElementById('chat-log');
const chatInput = document.getElementById('chat-input');
const chatSend = document.getElementById('chat-send');
let chatHistory = [];

function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  chatLog.appendChild(div);
  chatLog.scrollTop = chatLog.scrollHeight;
  return div;
}

addMsg('bot', "Hi — ask me anything about HVAC sizing, terminology, Manual D/duct design, or a permit/compliance question. I'll look things up live when it's a code or rebate question.");

async function sendChat() {
  const message = chatInput.value.trim();
  if (!message) return;
  chatInput.value = '';
  chatSend.disabled = true;
  addMsg('user', message);
  const thinking = addMsg('searching', 'Thinking…');

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message, history: chatHistory})
    });
    const data = await resp.json();
    thinking.remove();
    if (!resp.ok) {
      addMsg('error', data.error || 'Something went wrong.');
      return;
    }
    if (data.used_web_search) {
      const tag = document.createElement('div');
      tag.className = 'tag';
      tag.textContent = 'Looked this up live';
      chatLog.appendChild(tag);
    }
    addMsg('bot', data.answer);
    chatHistory.push({role: 'user', content: message});
    chatHistory.push({role: 'assistant', content: data.answer});
  } catch (e) {
    thinking.remove();
    addMsg('error', 'Could not reach the server: ' + e.message);
  } finally {
    chatSend.disabled = false;
  }
}

chatSend.addEventListener('click', sendChat);
chatInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendChat();
  }
});

/* ============================================================
   HOME VISIT WIZARD
   ============================================================ */

const PROJECTS_KEY = 'hvac_qa_projects';

const STEPS = [
  'address', 'confirm-sqft', 'sizing', 'nameplate', 'advice',
  'cfm', 'duct-tally', 'room-list', 'vent-count', 'asbestos', 'duct-condition',
  'attic', 'crawlspace', 'quote'
];

const AC_CLIMATE_RANGES = {
  hot: [400, 500],
  moderate: [500, 600],
  cool: [600, 700]
};

function defaultState() {
  return {
    id: null,
    name: '',
    nameManuallySet: false,
    updatedAt: null,
    stepIndex: 0,
    address: '',
    sqftLookup: null,       // {answer, sqft, source, confident}
    confirmedSqft: '',
    climate: 'moderate',
    nameplate: null,        // {answer, model_number, brand, tonnage, btu, age_years, age_source}
    nameplatePhoto: null,
    existingTonsOverride: '',
    existingAgeOverride: '',
    currentVentCount: '',
    bedrooms: null,
    bathrooms: null,
    roomList: [],            // [{id, name, size, vents}, ...] one row per physical room
    asbestos: {photo: null, whiteMaterial: '', preBuilt: ''},
    ductCondition: {rating: '', note: '', photo: null},
    atticInsulation: {rating: '', note: '', photo: null, needsReplacement: false, atticSqft: ''},
    crawlspaceMoisture: {rating: '', note: '', photo: null},
    furnaceBrand: '',
    acBrand: '',
    quote: {marginPct: 25, items: [], view: 'salesman'},
  };
}

function newProjectId() {
  return 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
}

function loadProjects() {
  try {
    const raw = localStorage.getItem(PROJECTS_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return [];
}

function saveProjects(projects) {
  localStorage.setItem(PROJECTS_KEY, JSON.stringify(projects));
}

function createNewProject() {
  const s = defaultState();
  s.id = newProjectId();
  return s;
}

// Every page load starts a genuinely fresh walkthrough — no silently
// resumed cached results from a prior session. Past visits are never lost;
// they just live in the sidebar instead of auto-populating "today."
let state = createNewProject();

function saveState() {
  if (!state.nameManuallySet) {
    state.name = state.address || 'New Visit';
  }
  state.updatedAt = new Date().toISOString();
  if (state.address || state.stepIndex > 0) {
    const projects = loadProjects();
    const idx = projects.findIndex(p => p.id === state.id);
    if (idx >= 0) projects[idx] = state;
    else projects.unshift(state);
    saveProjects(projects);
  }
  renderSidebar();
}

function openProject(id) {
  const proj = loadProjects().find(p => p.id === id);
  if (!proj) return;
  state = Object.assign(defaultState(), proj);
  renderWizard();
  closeSidebar();
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelector('.tab-btn[data-view="wizard-view"]').classList.add('active');
  document.getElementById('wizard-view').classList.add('active');
}

function startNewProject() {
  state = createNewProject();
  renderWizard();
  closeSidebar();
}

function renameProject(id) {
  const projects = loadProjects();
  const proj = projects.find(p => p.id === id);
  if (!proj) return;
  const next = prompt('Rename this visit:', proj.name || '');
  if (next === null) return;
  proj.name = next.trim() || proj.name;
  proj.nameManuallySet = true;
  saveProjects(projects);
  if (state.id === id) { state.name = proj.name; state.nameManuallySet = true; }
  renderSidebar();
}

function deleteProject(id) {
  if (!confirm('Delete this visit? This cannot be undone.')) return;
  saveProjects(loadProjects().filter(p => p.id !== id));
  if (state.id === id) startNewProject();
  else renderSidebar();
}

function archiveAndReset() {
  startNewProject();
}

/* ---- sidebar ---- */

const sidebarEl = document.getElementById('sidebar');
const sidebarBackdrop = document.getElementById('sidebar-backdrop');
const projectListEl = document.getElementById('project-list');

function openSidebar() { sidebarEl.classList.add('open'); sidebarBackdrop.classList.add('open'); renderSidebar(); }
function closeSidebar() { sidebarEl.classList.remove('open'); sidebarBackdrop.classList.remove('open'); }

document.getElementById('menu-btn').addEventListener('click', openSidebar);
sidebarBackdrop.addEventListener('click', closeSidebar);
document.getElementById('new-visit-btn').addEventListener('click', startNewProject);

function renderSidebar() {
  const projects = loadProjects().sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));
  if (!projects.length) {
    projectListEl.innerHTML = '<div class="empty">No saved visits yet — enter an address to start one.</div>';
    return;
  }
  projectListEl.innerHTML = projects.map(p => {
    const stepLabel = p.stepIndex >= STEPS.length - 1 ? 'Quote' : `Step ${p.stepIndex + 1} of ${STEPS.length}`;
    return `<div class="project-item ${p.id === state.id ? 'active' : ''}" data-id="${p.id}">
      <div class="p-info" data-action="open">
        <div class="p-name">${escapeHtml(p.name || 'New Visit')}</div>
        <div class="p-meta">${stepLabel}</div>
      </div>
      <button class="p-btn p-rename" title="Rename" data-action="rename">&#9998;</button>
      <button class="p-btn p-del" title="Delete" data-action="delete">&#10005;</button>
    </div>`;
  }).join('');

  projectListEl.querySelectorAll('.project-item').forEach(el => {
    const id = el.dataset.id;
    el.querySelector('[data-action="open"]').addEventListener('click', () => openProject(id));
    el.querySelector('[data-action="rename"]').addEventListener('click', (e) => { e.stopPropagation(); renameProject(id); });
    el.querySelector('[data-action="delete"]').addEventListener('click', (e) => { e.stopPropagation(); deleteProject(id); });
  });
}

/* ---- deterministic sizing helpers (no LLM call needed) ---- */

function furnaceTonsForSqft(sqft) {
  if (!sqft || sqft <= 0) return null;
  if (sqft < 1100) return 2;
  if (sqft < 1400) return 2.5;
  if (sqft < 1600) return 3;
  if (sqft < 1800) return 3.5;
  if (sqft < 2200) return 4;
  if (sqft <= 2600) return 5;
  return null; // beyond standard chart — needs a real Manual J
}

function acTonsRangeForSqft(sqft, climate) {
  if (!sqft || sqft <= 0) return null;
  const [lo, hi] = AC_CLIMATE_RANGES[climate] || AC_CLIMATE_RANGES.moderate;
  const tonsMin = sqft / hi;
  const tonsMax = sqft / lo;
  const likely = Math.round(((tonsMin + tonsMax) / 2) * 2) / 2; // nearest 0.5 ton
  return {min: tonsMin, max: tonsMax, likely};
}

function requiredCfmForTons(tons) {
  if (!tons) return null;
  return Math.round(tons * 300);
}

function fmtTons(t) {
  if (t === null || t === undefined || t === '') return '—';
  return (Math.round(t * 2) / 2).toFixed(1).replace(/\.0$/, '') + ' ton';
}

/* ---- rendering ---- */

const progressEl = document.getElementById('wizard-progress');
const bodyEl = document.getElementById('wizard-body');

function stepTitle(i) {
  return ['Address', 'Square Footage', 'Recommended Size', 'Nameplate', 'Advice',
          'Duct CFM Needed', 'Current Vent Count', 'Room List', 'Confirm Vents & Ducting',
          'Asbestos Check', 'Duct Condition', 'Attic Insulation', 'Crawlspace', 'Quote'][i];
}

function renderWizard() {
  const i = state.stepIndex;
  progressEl.textContent = `Step ${i + 1} of ${STEPS.length} — ${stepTitle(i)}`;
  bodyEl.innerHTML = '';
  const renderFn = {
    'address': renderAddressStep,
    'confirm-sqft': renderConfirmSqftStep,
    'sizing': renderSizingStep,
    'nameplate': renderNameplateStep,
    'advice': renderAdviceStep,
    'cfm': renderCfmStep,
    'duct-tally': renderDuctTallyStep,
    'room-list': renderRoomListStep,
    'vent-count': renderVentCountStep,
    'asbestos': renderAsbestosStep,
    'duct-condition': () => renderInspectionStep('ductCondition', 'Duct Condition',
      'Visually check the ductwork — connections, insulation wrap, signs of damage or disconnection. Photo required.'),
    'attic': renderAtticStep,
    'crawlspace': () => renderInspectionStep('crawlspaceMoisture', 'Crawlspace Moisture',
      'Check the crawlspace for standing water, damp soil, or vapor barrier issues. Photo required.'),
    'quote': renderQuoteStep,
  }[STEPS[i]];
  renderFn();
  saveState();
}

function navButtons(container, {backDisabled, nextDisabled, nextLabel, onNext} = {}) {
  const row = document.createElement('div');
  row.className = 'btn-row';
  if (state.stepIndex > 0) {
    const back = document.createElement('button');
    back.className = 'btn btn-secondary';
    back.textContent = 'Back';
    back.style.flex = '0 0 90px';
    back.disabled = !!backDisabled;
    back.addEventListener('click', () => { state.stepIndex--; renderWizard(); });
    row.appendChild(back);
  }
  const next = document.createElement('button');
  next.className = 'btn btn-primary';
  next.textContent = nextLabel || (state.stepIndex === STEPS.length - 1 ? 'Finish' : 'Next');
  next.disabled = !!nextDisabled;
  next.addEventListener('click', () => {
    if (onNext) onNext();
    if (state.stepIndex < STEPS.length - 1) { state.stepIndex++; renderWizard(); }
  });
  row.appendChild(next);
  container.appendChild(row);
}

/* Step 1: address */
function renderAddressStep() {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <h2>Property address</h2>
    <p class="sub">Enter the address before heading in — we'll try to pull the square footage automatically from public listing sources so you have a starting point.</p>
    <label class="field-label" for="address-input">Address</label>
    <input type="text" id="address-input" placeholder="123 Main St, San Francisco, CA" value="${escapeHtml(state.address)}">
    <button class="btn btn-primary" id="lookup-btn">Look Up Square Footage</button>
    <div id="lookup-result"></div>
  `;
  bodyEl.appendChild(card);

  const input = card.querySelector('#address-input');
  input.addEventListener('input', () => { state.address = input.value; saveState(); });

  const resultDiv = card.querySelector('#lookup-result');
  if (state.sqftLookup) renderLookupResult(resultDiv, state.sqftLookup);

  card.querySelector('#lookup-btn').addEventListener('click', async () => {
    const address = input.value.trim();
    if (!address) { input.focus(); return; }
    state.address = address;
    const btn = card.querySelector('#lookup-btn');
    btn.disabled = true;
    btn.textContent = 'Searching…';
    resultDiv.innerHTML = '';
    try {
      const resp = await fetch('/api/lookup-sqft', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({address})
      });
      const data = await resp.json();
      if (!resp.ok) {
        resultDiv.innerHTML = `<div class="result-box warn">${escapeHtml(data.error || 'Lookup failed.')}</div>`;
      } else {
        state.sqftLookup = data;
        if (data.sqft) state.confirmedSqft = data.sqft;
        if (data.bedrooms) state.bedrooms = data.bedrooms;
        if (data.bathrooms) state.bathrooms = data.bathrooms;
        renderLookupResult(resultDiv, data);
      }
    } catch (e) {
      resultDiv.innerHTML = `<div class="result-box warn">Could not reach the server: ${escapeHtml(e.message)}</div>`;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Look Up Square Footage';
      saveState();
    }
  });

  navButtons(card, {});
}

function renderLookupResult(container, data) {
  const cls = data.confident && data.sqft ? 'good' : 'warn';
  const sqftLine = data.sqft ? `<strong>${data.sqft.toLocaleString()} sqft</strong>${data.source ? ' — ' + escapeHtml(data.source) : ''}\n` : '';
  const bedBathLine = (data.bedrooms || data.bathrooms) ? `${data.bedrooms || '—'} bed / ${data.bathrooms || '—'} bath\n\n` : '\n';
  container.innerHTML = `<div class="result-box ${cls}">${sqftLine}${bedBathLine}${escapeHtml(data.answer || '')}</div>`;
}

  const sqft = parseFloat(state.confirmedSqft);
  const furnaceTons = furnaceTonsForSqft(sqft);
  const acRange = acTonsRangeForSqft(sqft, state.climate);

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <h2>Recommended size for this home</h2>
    <p class="sub">Computed directly from the sizing tables — furnace from square footage, AC from square footage + climate (heating and cooling are different calculations, see the Q&A tab for why).</p>
    <div class="stat-row">
      <div class="stat">
        <div class="num">${furnaceTons ? fmtTons(furnaceTons) : '—'}</div>
        <div class="lbl">Furnace (heating)</div>
      </div>
      <div class="stat">
        <div class="num">${acRange ? fmtTons(acRange.likely) : '—'}</div>
        <div class="lbl">AC (cooling), likely</div>
      </div>
    </div>
    ${acRange ? `<div class="result-box">AC range: ${acRange.min.toFixed(1)}–${acRange.max.toFixed(1)} tons depending on sun exposure, insulation, and windows. This is a rule-of-thumb estimate, not a Manual J calculation.</div>` : ''}
    ${!furnaceTons ? `<div class="result-box warn">${sqft ? sqft.toLocaleString() + ' sqft is beyond the standard chart — this needs a real load calculation, not a rule of thumb.' : 'Go back and enter a square footage to see a recommendation.'}</div>` : ''}
  `;
  bodyEl.appendChild(card);
  navButtons(card, {});
}

/* Step 5: advice (deterministic — replace vs diagnostic + mis-size flag) */
function renderAdviceStep() {
  const existingTons = parseFloat(state.existingTonsOverride) || (state.nameplate && state.nameplate.tonnage) || null;
  const existingAge = parseFloat(state.existingAgeOverride) || (state.nameplate && state.nameplate.age_years) || null;
  const sqft = parseFloat(state.confirmedSqft);
  const recommendedFurnaceTons = furnaceTonsForSqft(sqft);

  let ageAdvice, ageCls;
  if (existingAge === null) {
    ageAdvice = "Age unknown — couldn't determine it from the nameplate or a manual entry. Without an age, lead with a diagnostic rather than assuming replacement is warranted.";
    ageCls = 'warn';
  } else if (existingAge >= 15) {
    ageAdvice = `System is ${existingAge} years old (15+). Position this toward a replacement conversation — at this age, efficiency losses and rising failure risk generally make replacement the stronger case.`;
    ageCls = 'bad';
  } else {
    ageAdvice = `System is ${existingAge} years old (under 15). Recommend scheduling a diagnostic rather than jumping straight to a replacement pitch — more likely to be a fixable issue.`;
    ageCls = 'good';
  }

  let sizeAdvice = null;
  if (existingTons && recommendedFurnaceTons && existingTons !== recommendedFurnaceTons) {
    sizeAdvice = `Existing system is ${fmtTons(existingTons)}, but this home calls for ${fmtTons(recommendedFurnaceTons)}. That's a mis-size — worth flagging regardless of age (see "Why sizing matters" in the Q&A tab).`;
  }

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <h2>Replace or diagnose?</h2>
    <div class="result-box ${ageCls}">${escapeHtml(ageAdvice)}</div>
    ${sizeAdvice ? `<div class="result-box bad">${escapeHtml(sizeAdvice)}</div>` : ''}
  `;
  bodyEl.appendChild(card);
  navButtons(card, {});
}

/* Vent/duct replacement count — drives quote line items directly */
const TRUNK_COMBINE_RULES = [
  {a: 4, b: 4, result: 6},
  {a: 6, b: 6, result: 8},
  {a: 8, b: 8, result: 10},
  {a: 8, b: 10, result: 12},
  {a: 10, b: 10, result: 14},
  {a: 10, b: 12, result: 14},
];

function findCombineRule(x, y) {
  return TRUNK_COMBINE_RULES.find(r => (r.a === x && r.b === y) || (r.a === y && r.b === x)) || null;
}

// At each step, prefer pairing two branches of the SAME size (smallest
// size first) - that's how real branches actually join at a wye/tee.
// Only when no same-size pair is available does an odd leftover merge
// into an already-upsized trunk via a cross-size rule (e.g. 8"+10"->12").
function findBestCombinablePair(multiset) {
  const sizes = [...new Set(multiset)].sort((a, b) => a - b);
  for (const s of sizes) {
    const count = multiset.filter(x => x === s).length;
    if (count >= 2) {
      const rule = findCombineRule(s, s);
      if (rule) return {a: s, b: s, result: rule.result};
    }
  }
  const crossRules = TRUNK_COMBINE_RULES.filter(r => r.a !== r.b).sort((r1, r2) => (r1.a + r1.b) - (r2.a + r2.b));
  for (const rule of crossRules) {
    if (multiset.includes(rule.a) && multiset.includes(rule.b)) {
      return {a: rule.a, b: rule.b, result: rule.result};
    }
  }
  return null;
}

// Reduces a flat list of branch duct sizes into the trunk size needed at
// the plenum, using EM's field combine convention (not a generic CFM
// formula - see knowledge base). Assumes one continuous trunk gathering
// all branches; a real multi-trunk layout would need smaller connections
// per trunk than this single-trunk worst case.
function designTrunk(branchSizes) {
  let multiset = [...branchSizes];
  if (!multiset.length) return null;
  const steps = [];
  while (multiset.length > 1) {
    const pair = findBestCombinablePair(multiset);
    if (!pair) return {steps, unresolved: true, remaining: [...multiset]};
    multiset.splice(multiset.indexOf(pair.a), 1);
    multiset.splice(multiset.indexOf(pair.b), 1);
    multiset.push(pair.result);
    steps.push({from: pair.a, added: pair.b, to: pair.result});
  }
  return {steps, final: multiset[0], unresolved: false};
}

function newRoomId() {
  return 'r_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
}

// Each row is ONE physical room, not a category with a count multiplier —
// that's what let a rep specify "this one bedroom has 2 vents" instead of
// only being able to bump a whole category at once.
function buildDefaultRoomList() {
  const rows = [
    // Kitchens are sometimes small enough to only need a 6" branch, not
    // always 8" like other larger rooms — default to 6", rep bumps to 8"
    // if it's actually a big kitchen.
    {id: newRoomId(), name: 'Kitchen', size: 6, vents: 1},
    {id: newRoomId(), name: 'Living Room', size: 8, vents: 1},
    {id: newRoomId(), name: 'Dining Room', size: 8, vents: 1},
  ];
  const bedroomCount = parseInt(state.bedrooms) || 1;
  for (let i = 1; i <= bedroomCount; i++) {
    rows.push({id: newRoomId(), name: `Bedroom ${i}`, size: 6, vents: 1});
  }
  const bathroomCount = parseInt(state.bathrooms) || 1;
  for (let i = 1; i <= bathroomCount; i++) {
    rows.push({id: newRoomId(), name: `Bathroom ${i}`, size: 4, vents: 1});
  }
  return rows;
}

// A project saved before the room-list rework has rows in the old shape
// (roomCount/ventsPerRoom categories, no individual `vents` field). Rather
// than trying to carefully migrate that old shape field-by-field, just
// detect it and rebuild fresh defaults - this is field-test data, not
// customer records that need perfect preservation.
function ensureCurrentRoomListShape() {
  const isStale = state.roomList.some(r => r.vents === undefined);
  if (!state.roomList.length || isStale) {
    state.roomList = buildDefaultRoomList();
    saveState();
  }
}

function roomSizeSelectHtml(r) {
  return `<select class="room-size">
    <option value="4" ${r.size === 4 ? 'selected' : ''}>4"</option>
    <option value="6" ${r.size === 6 ? 'selected' : ''}>6"</option>
    <option value="8" ${r.size === 8 ? 'selected' : ''}>8"</option>
  </select>`;
}

/* Step: list the individual rooms getting new ductwork (name + branch size) */
// Additive-only: adds whatever Bedroom N / Bathroom N rows are missing
// relative to the address lookup's count, without touching or duplicating
// rows that already exist (safe to click more than once, and safe if the
// rep already renamed/removed some rows).
function syncRoomPrefix(prefix, size, target) {
  const usedNumbers = new Set(
    state.roomList
      .map(r => { const m = new RegExp('^' + prefix + ' (\\d+)$').exec(r.name); return m ? parseInt(m[1]) : null; })
      .filter(n => n !== null)
  );
  let added = 0;
  for (let i = 1; i <= target; i++) {
    if (!usedNumbers.has(i)) {
      state.roomList.push({id: newRoomId(), name: `${prefix} ${i}`, size, vents: 1});
      added++;
    }
  }
  return added;
}

function syncBedroomsBathrooms() {
  const added = syncRoomPrefix('Bedroom', 6, parseInt(state.bedrooms) || 0)
              + syncRoomPrefix('Bathroom', 4, parseInt(state.bathrooms) || 0);
  if (added > 0) saveState();
  return added;
}

function renderRoomListStep() {
  ensureCurrentRoomListShape();
  const justAdded = syncBedroomsBathrooms();

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <h2>List the rooms</h2>
    <p class="sub">One row per room. Bedrooms/bathrooms are pulled in automatically from the earlier address lookup (so each one can be adjusted on its own) — rename, resize, remove, or add rooms to match the actual home.</p>
    ${justAdded > 0 ? `<div class="result-box good">Added ${justAdded} bedroom/bathroom row${justAdded === 1 ? '' : 's'} from the address lookup.</div>` : ''}
    <div id="room-rows"></div>

/* Step: confirm vents (and re-confirm size) per individual room, then run the trunk design calculator */
function renderVentCountStep() {
  ensureCurrentRoomListShape();

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <h2>Confirm vents & duct design</h2>
    <p class="sub">Confirm how many vents each room actually needs, and its branch size — a bigger room may need more than one vent.</p>
    <div id="vent-reconcile-box"></div>
    <div id="vent-rows"></div>
    <div id="trunk-design-box"></div>
  `;
  bodyEl.appendChild(card);

  const rowsEl = card.querySelector('#vent-rows');
  const trunkBox = card.querySelector('#trunk-design-box');
  const reconcileBox = card.querySelector('#vent-reconcile-box');

  function updateReconcileBox() {
    const target = parseInt(state.currentVentCount);
    if (!target) { reconcileBox.innerHTML = ''; return; }
    const actual = state.roomList.reduce((sum, r) => sum + (parseInt(r.vents) || 0), 0);
    const gap = target - actual;
    const roomCount = state.roomList.length;
    if (gap > 0) {
      reconcileBox.innerHTML = `<div class="result-box warn">You counted ${target} total vents in the home, but these ${roomCount} rooms only add up to ${actual} so far — ${gap} vent${gap === 1 ? '' : 's'} still unaccounted for. That likely means one or more rooms actually have more than one vent — bump the count on whichever room(s) it is.</div>`;
    } else if (gap < 0) {
      reconcileBox.innerHTML = `<div class="result-box warn">These rooms add up to ${actual} vents, more than the ${target} you counted in the home — double-check the room vent counts against what's actually there.</div>`;
    } else {
      reconcileBox.innerHTML = `<div class="result-box good">Matches your counted total of ${target} vents.</div>`;
    }
  }

  function recompute() {
    saveState();
    updateReconcileBox();

    const branches = [];
    state.roomList.forEach(r => {
      const vents = parseInt(r.vents) || 0;
      for (let i = 0; i < vents; i++) branches.push(r.size);
    });
    if (!branches.length) { trunkBox.innerHTML = ''; return; }

    const design = designTrunk(branches);
    let html = `<div class="result-box">${design.steps.map(s => `${s.from}" + ${s.added}" → ${s.to}"`).join('<br>') || 'Single branch, no combining needed.'}</div>`;
    if (design.unresolved) {
      const remainingStr = design.remaining.map(s => `${s}"`).join(' + ');
      html += `<div class="result-box warn">No defined combine step for the remaining ${remainingStr} — this layout needs a real duct design rather than this quick estimate. Flag it for a proper Manual D calculation.</div>`;
    } else {
      html += `<div class="result-box good"><strong>Plenum connection needed: ${design.final}"</strong><br>Verify the plenum has enough surface area to fit a ${design.final}" connection before quoting this layout.</div>`;
    }
    trunkBox.innerHTML = html;
  }

  function renderRows() {
    rowsEl.innerHTML = state.roomList.map(r => `
      <div class="room-row" data-id="${r.id}">
        <div class="room-row-label">${escapeHtml(r.name || 'Unnamed room')}</div>
        ${roomSizeSelectHtml(r)}
        <input type="number" min="0" class="room-count room-vents-per" placeholder="Vents" value="${r.vents}">
      </div>
    `).join('');

    rowsEl.querySelectorAll('.room-row').forEach(rowEl => {
      const id = rowEl.dataset.id;
      const room = state.roomList.find(r => r.id === id);
      rowEl.querySelector('.room-size').addEventListener('change', (e) => { room.size = parseInt(e.target.value); recompute(); });
      rowEl.querySelector('.room-vents-per').addEventListener('input', (e) => { room.vents = e.target.value; recompute(); });
    });
    recompute();
  }
  renderRows();

  navButtons(card, {});
}

/* ============================================================
   QUOTE ENGINE (uses window.EM_PRICING from pricing-catalog.js)
   ============================================================ */

function furnaceLabelToken(tons) {
  return (tons === 2 || tons === 2.5) ? '2–2.5 Ton' : `${tons} Ton`;
}

function pickDefaultOption(opts, preferredPattern) {
  return opts.find(([label]) => preferredPattern.test(label)) || opts[0] || null;
}

function isReplacementScenario() {
  const sqft = parseFloat(state.confirmedSqft);
  const furnaceTons = furnaceTonsForSqft(sqft);
  const existingTons = parseFloat(state.existingTonsOverride) || (state.nameplate && state.nameplate.tonnage) || null;
  const existingAge = parseFloat(state.existingAgeOverride) || (state.nameplate && state.nameplate.age_years) || null;
  return (existingAge !== null && existingAge >= 15) || !!(existingTons && furnaceTons && existingTons !== furnaceTons);
}

function buildAutoQuoteItems() {
  const P = window.EM_PRICING;
  const items = [];
  let nextId = 1;
  function addItem(name, unit, qty, selectLabel) {
    const entry = P.findEntry(name);
    if (!entry) return;
    const cost = P.baseCost(name, qty, selectLabel);
    items.push({id: nextId++, name, unit: unit || entry.u, qty, selectLabel: selectLabel || null, baseCost: cost, customerPrice: 0, auto: true, locked: false});
  }

  const sqft = parseFloat(state.confirmedSqft);
  const furnaceTons = furnaceTonsForSqft(sqft);
  const acRange = acTonsRangeForSqft(sqft, state.climate);
  const replacement = isReplacementScenario();

  if (replacement && furnaceTons) {
    const opts = (P.SELECT_OPTS.by_furnace_tonnage || []).filter(([label]) => label.includes(furnaceLabelToken(furnaceTons)));
    const chosen = state.furnaceBrand && opts.some(([l]) => l === state.furnaceBrand) ? state.furnaceBrand : (pickDefaultOption(opts, /Payne 80% 1-stage/) || [null])[0];
    if (chosen) { state.furnaceBrand = chosen; addItem('Furnace Installation', 'by_furnace_tonnage', 1, chosen); }
    addItem('Furnace Removal & Disposal', 'variable', 1, null);
  }
  if (replacement && acRange) {
    const opts = (P.SELECT_OPTS.by_ac_tonnage || []).filter(([label]) => label.includes(`${acRange.likely} Ton`));
    const chosen = state.acBrand && opts.some(([l]) => l === state.acBrand) ? state.acBrand : (pickDefaultOption(opts, /Payne PA5S/) || [null])[0];
    if (chosen) { state.acBrand = chosen; addItem('A/C Installation', 'by_ac_tonnage', 1, chosen); }
    addItem('A/C Removal & Disposal', 'variable', 1, null);
  }

  const ventCount = state.roomList.reduce((sum, r) => sum + (parseInt(r.vents) || 0), 0);
  if (ventCount > 0) {
    addItem('Air Duct Replacement', 'per_unit', ventCount, null);
    addItem('Vent Boots Installation', 'per_unit', ventCount, null);
  }

  if (state.atticInsulation.needsReplacement) {
    const atticSqft = parseFloat(state.atticInsulation.atticSqft) || 0;
    if (atticSqft > 0) {
      addItem('Attic Insulation Removal', 'per_sqft', atticSqft, null);
      addItem('Attic Insulation Installation', 'by_attic_insulation_install', atticSqft, 'R-38 blown in');
      addItem('Air Sealing (Attic)', 'per_unit', 1, null);
      addItem('Attic Clean Up', 'variable', 1, null);
      addItem('Sanitizing & Disinfecting (Attic)', 'variable', 1, null);
    }
  }

  const asbestosFlagged = state.asbestos.whiteMaterial === 'yes' || state.asbestos.whiteMaterial === 'unsure';
  if (asbestosFlagged && ventCount > 0) {
    let tierLabel = ventCount < 6 ? '< 6 Air Ducts' : (ventCount <= 9 ? '6 – 9 Air Ducts' : '10 – 12 Air Ducts');
    addItem('Asbestos Air Ducts Abatement', 'by_asbestos_air_ducts', 1, tierLabel);
  }

  return items;
}

function recomputeQuotePrices() {
  const P = window.EM_PRICING;
  const marginPct = (parseFloat(state.quote.marginPct) || 0) / 100;
  P.applyComboRules(state.quote.items);
  state.quote.items.forEach(it => {
    it.baseCost = P.baseCost(it.name, it.qty, it.selectLabel);
    if (!it.locked) {
      const eff = P.effectiveCost(it);
      it.customerPrice = P.defaultCustomerPrice(it.name, it.unit, eff, marginPct);
    }
  });
}

function quoteTotals() {
  const P = window.EM_PRICING;
  let rev = 0, cost = 0;
  state.quote.items.forEach(it => {
    rev += (parseFloat(it.customerPrice) || 0);
    const eff = P.effectiveCost(it);
    cost += eff || 0;
  });
  return {rev, cost, profit: rev - cost, marginPct: rev > 0 ? (rev - cost) / rev * 100 : null};
}

function fmtMoney(n) {
  return '$' + (Math.round((n || 0) * 100) / 100).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
}

function renderQuoteStep() {
  if (!state.quote.items || state.quote.items.length === 0) {
    state.quote.items = buildAutoQuoteItems();
  }
  recomputeQuotePrices();

  const sqft = parseFloat(state.confirmedSqft);
  const furnaceTons = furnaceTonsForSqft(sqft);
  const acRange = acTonsRangeForSqft(sqft, state.climate);
  const existingTons = parseFloat(state.existingTonsOverride) || (state.nameplate && state.nameplate.tonnage) || null;
  const existingAge = parseFloat(state.existingAgeOverride) || (state.nameplate && state.nameplate.age_years) || null;
  const ratingLabel = r => ({good: 'Good', warn: 'Needs Attention', bad: 'Urgent Issue', '': 'Not recorded'}[r] || 'Not recorded');
  const replacement = isReplacementScenario();

  const notesRows = [
    ['Address', state.address || '—'],
    ['Confirmed square footage', sqft ? sqft.toLocaleString() + ' sqft' : '—'],
    ['Recommended sizing', (furnaceTons ? 'Furnace ' + fmtTons(furnaceTons) : '—') + (acRange ? ', AC ' + fmtTons(acRange.likely) : '')],
    ['Existing system', (existingTons ? fmtTons(existingTons) : '—') + (existingAge ? `, ${existingAge} yrs old` : ', age unknown')],
    ['Path', replacement ? 'Replacement recommended' : 'Diagnostic recommended (not a full replacement quote)'],
    ['Duct condition', ratingLabel(state.ductCondition.rating)],
    ['Attic insulation', ratingLabel(state.atticInsulation.rating) + (state.atticInsulation.needsReplacement ? ' — replacement bundled below' : '')],
    ['Crawlspace moisture', ratingLabel(state.crawlspaceMoisture.rating)],
    ['Asbestos flag', state.asbestos.whiteMaterial === 'yes' ? 'Flagged — white material observed' : state.asbestos.whiteMaterial === 'unsure' ? 'Flagged — unsure' : 'Not flagged'],
  ];

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<h2>Visit notes</h2>${notesRows.map(([k, v]) => `<div class="summary-item"><div class="k">${escapeHtml(k)}</div><div class="v">${escapeHtml(String(v))}</div></div>`).join('')}`;
  bodyEl.appendChild(card);

  if (!replacement) {
    const note = document.createElement('div');
    note.className = 'card';
    note.innerHTML = `<div class="result-box warn">This visit's assessment points to a diagnostic, not a full system replacement — no furnace/AC line items were auto-added. Use "+ Add Service" below if the customer wants a replacement quote for comparison anyway.</div>`;
    bodyEl.appendChild(note);
  }

  const qcard = document.createElement('div');
  qcard.className = 'card';
  qcard.innerHTML = `
    <h2>Quote</h2>
    <div class="qview-toggle">
      <button class="qview-btn ${state.quote.view==='salesman'?'active':''}" id="view-salesman">Salesman View</button>
      <button class="qview-btn ${state.quote.view==='client'?'active':''}" id="view-client">Client View</button>
    </div>
    <div class="margin-row">
      <label for="margin-input">Target margin</label>
      <input type="number" id="margin-input" min="0" max="90" value="${state.quote.marginPct}">
      <span>%</span>
    </div>
    <div id="qtable-wrap"></div>
    <div class="add-svc-wrap">
      <input type="text" id="add-svc-search" placeholder="+ Add a service…">
      <div class="add-svc-results" id="add-svc-results" style="display:none;"></div>
    </div>
    <div class="qtotals" id="qtotals"></div>
  `;
  bodyEl.appendChild(qcard);

  qcard.querySelector('#view-salesman').addEventListener('click', () => { state.quote.view = 'salesman'; saveState(); renderWizard(); });
  qcard.querySelector('#view-client').addEventListener('click', () => { state.quote.view = 'client'; saveState(); renderWizard(); });

  qcard.querySelector('#margin-input').addEventListener('input', (e) => {
    state.quote.marginPct = e.target.value;
    saveState();
    renderWizard();
  });

  renderQuoteTable(qcard.querySelector('#qtable-wrap'));
  renderQuoteTotals(qcard.querySelector('#qtotals'));
  wireAddService(qcard);

  const row = document.createElement('div');
  row.className = 'btn-row';
  const back = document.createElement('button');
  back.className = 'btn btn-secondary';
  back.textContent = 'Back';
  back.style.flex = '0 0 90px';
  back.addEventListener('click', () => { state.stepIndex--; renderWizard(); });
  row.appendChild(back);
  const finish = document.createElement('button');
  finish.className = 'btn btn-primary';
  finish.textContent = 'Finish & Start New Visit';
  finish.addEventListener('click', () => { archiveAndReset(); });
  row.appendChild(finish);
  qcard.appendChild(row);
}

function renderQuoteTable(container) {
  const P = window.EM_PRICING;
  const salesman = state.quote.view === 'salesman';
  const rows = state.quote.items.map(it => {
    const eff = P.effectiveCost(it);
    const profit = (parseFloat(it.customerPrice) || 0) - (eff || 0);
    const margin = it.customerPrice > 0 ? (profit / it.customerPrice * 100).toFixed(0) + '%' : '—';
    const qtyEditable = P.SQFT_UNITS.has(it.unit) || it.unit === 'per_unit' || it.unit === 'per_vent' || it.unit === 'per_lnft';
    return `<tr data-id="${it.id}">
      <td><div class="qname">${escapeHtml(it.name)}</div>${it.selectLabel ? `<div class="svc-unit">${escapeHtml(it.selectLabel)}</div>` : ''}${it.auto ? '<div class="qauto">Auto</div>' : ''}</td>
      <td class="r">${qtyEditable ? `<input type="number" min="0" class="qty-inp" value="${it.qty}">` : it.qty}</td>
      ${salesman ? `<td class="r">${eff === null ? '—' : fmtMoney(eff)}</td>` : ''}
      <td class="r"><input type="number" min="0" step="0.01" class="price-inp" value="${it.customerPrice}"></td>
      ${salesman ? `<td class="r">${eff === null ? '—' : fmtMoney(profit) + ' (' + margin + ')'}</td>` : ''}
      <td><button class="qrm" data-id="${it.id}" title="Remove">✕</button></td>
    </tr>`;
  }).join('');

  container.innerHTML = `
    <div style="overflow-x:auto;">
    <table class="qtable">
      <thead><tr>
        <th>Service</th><th class="r">Qty</th>
        ${salesman ? '<th class="r">EM Cost</th>' : ''}
        <th class="r">Price</th>
        ${salesman ? '<th class="r">Profit</th>' : ''}
        <th></th>
      </tr></thead>
      <tbody>${rows || '<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:16px;">No items yet</td></tr>'}</tbody>
    </table>
    </div>
  `;

  container.querySelectorAll('.qty-inp').forEach(inp => {
    inp.addEventListener('input', () => {
      const id = parseInt(inp.closest('tr').dataset.id);
      const item = state.quote.items.find(i => i.id === id);
      item.qty = parseFloat(inp.value) || 0;
      saveState();
      renderWizard();
    });
  });
  container.querySelectorAll('.price-inp').forEach(inp => {
    inp.addEventListener('input', () => {
      const id = parseInt(inp.closest('tr').dataset.id);
      const item = state.quote.items.find(i => i.id === id);
      item.customerPrice = parseFloat(inp.value) || 0;
      item.locked = true;
      saveState();
      renderQuoteTotals(document.getElementById('qtotals'));
    });
  });
  container.querySelectorAll('.qrm').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = parseInt(btn.dataset.id);
      state.quote.items = state.quote.items.filter(i => i.id !== id);
      saveState();
      renderWizard();
    });
  });
}

function renderQuoteTotals(container) {
  const t = quoteTotals();
  const salesman = state.quote.view === 'salesman';
  container.innerHTML = `
    <div class="stat"><div class="num">${fmtMoney(t.rev)}</div><div class="lbl">Total</div></div>
    ${salesman ? `<div class="stat"><div class="num">${fmtMoney(t.cost)}</div><div class="lbl">EM Cost</div></div>` : ''}
    ${salesman ? `<div class="stat"><div class="num">${fmtMoney(t.profit)}</div><div class="lbl">Profit</div></div>` : ''}
    ${salesman ? `<div class="stat"><div class="num">${t.marginPct === null ? '—' : t.marginPct.toFixed(1) + '%'}</div><div class="lbl">Margin</div></div>` : ''}
  `;
}

function wireAddService(container) {
  const P = window.EM_PRICING;
  const search = container.querySelector('#add-svc-search');
  const results = container.querySelector('#add-svc-results');
  search.addEventListener('input', () => {
    const q = search.value.trim().toLowerCase();
    if (!q) { results.style.display = 'none'; results.innerHTML = ''; return; }
    const matches = P.DB_BASE.filter(e => e.n.toLowerCase().includes(q)).slice(0, 15);
    results.innerHTML = matches.map(e => `<div class="add-svc-item" data-name="${escapeHtml(e.n)}">${escapeHtml(e.n)}</div>`).join('') || '<div class="add-svc-item">No matches</div>';
    results.style.display = 'block';
    results.querySelectorAll('.add-svc-item[data-name]').forEach(el => {
      el.addEventListener('click', () => {
        const entry = P.findEntry(el.dataset.name);
        if (!entry) return;
        let selectLabel = null;
        if (P.SELECT_UNIT_TYPES.has(entry.u)) {
          const opts = P.SELECT_OPTS[entry.u] || [];
          selectLabel = (opts.find(([l, v]) => v !== '') || [null])[0];
        }
        const qty = 1;
        state.quote.items.push({
          id: Date.now(), name: entry.n, unit: entry.u, qty,
          selectLabel, baseCost: P.baseCost(entry.n, qty, selectLabel),
          customerPrice: 0, auto: false, locked: false,
        });
        search.value = '';
        results.style.display = 'none';
        saveState();
        renderWizard();
      });
    });
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : str;
  return div.innerHTML;
}

renderWizard();
renderSidebar();
</script>

</body>
</html>
